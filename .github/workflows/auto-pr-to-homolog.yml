name: Auto create PR to branch homolog

on:
  push:
    branches-ignore:
      - homolog
      - master      

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr-to-homolog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check and create PR to homolog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          
          # Check if an open PR already exists for this branch targeting homolog
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base homolog --state open --json number --jq '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            echo "No open PR found. Creating PR from $BRANCH_NAME to homolog..."
            gh pr create \
              --base homolog \
              --head "$BRANCH_NAME" \
              --title "Merge $BRANCH_NAME into homolog" \
              --body "Automated PR created on push to branch \`$BRANCH_NAME\`."
          else
            echo "PR #${EXISTING_PR} already exists for $BRANCH_NAME -> homolog."
          fi
